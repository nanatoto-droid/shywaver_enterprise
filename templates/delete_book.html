{% extends 'base.html' %}

{% block title %}Delete Book - Book Nook{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-24">
    <div class="bg-white rounded-xl shadow-lg overflow-hidden">
        <div class="p-6 md:p-8 text-center">
            <div class="text-6xl mb-4">⚠️</div>
            <h1 class="text-2xl font-bold text-gray-900 mb-4">Delete Book</h1>
            <p class="text-gray-600 mb-6">Are you sure you want to delete "<strong>{{ book.title }}</strong>" by {{ book.author }}? This action cannot be undone.</p>
            
            <form method="post" class="flex justify-center space-x-4">
                {% csrf_token %}
                <a href="{% url 'book_detail' book.slug %}" class="px-6 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition">Cancel</a>
                <button type="submit" class="px-6 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition">Yes, Delete</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
